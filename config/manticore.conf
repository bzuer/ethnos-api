#############################################################################
# Manticore Search configuration for Ethnos_API
#
# Plain main+delta indexes built by `indexer` directly from the MariaDB base
# tables (works / publications / authorships / persons / work_subjects /
# subjects / venues / files). No denormalized columns are read or written in
# MariaDB: the author / subject / venue text is concatenated at index time via
# sql_joined_field, so `works.authors_search` and `works.subjects_search` are
# obsolete and slated for removal.
#
# Path mode (no `data_dir`): searchd serves the on-disk plain tables that the
# operator rebuilds with `indexer --rotate`. The API is strictly read-only
# against searchd (SphinxQL on 127.0.0.1:9306) and never writes to the index.
#
# Deploy: scripts/manticore/render-config.sh fills __DB_PASSWORD__ from
# /etc/node-backend.env and installs this file to /etc/manticoresearch/manticore.conf.
# Secrets are never committed; the repo copy keeps the placeholder.
#############################################################################

source src_ethnos
{
    type            = mysql
    sql_host        = localhost
    sql_port        = 3306
    sql_user        = dev
    sql_pass        = __DB_PASSWORD__
    sql_db          = data
    sql_range_step  = 50000
    sql_query_pre   = SET NAMES utf8mb4
    sql_query_pre   = SET SESSION net_read_timeout = 3600
}

#############################################################################
# WORKS — main (full corpus) and delta (recently updated)
# Full-text fields: title, subtitle, abstract, authors, subjects, venue.
# Attributes: work_type, language, citation_count, reference_count,
#             download_count, min_year, max_year, created_ts,
#             years[] / oa_flags[] / pr_flags[] (per-publication MVAs).
#############################################################################

source works_main : src_ethnos
{
    sql_query_range  = SELECT MIN(id), MAX(id) FROM works
    sql_query        = \
        SELECT \
            w.id                               AS id, \
            w.title                            AS title, \
            COALESCE(w.subtitle,'')            AS subtitle, \
            COALESCE(w.abstract,'')            AS abstract, \
            w.work_type                        AS work_type, \
            COALESCE(w.language,'')            AS language, \
            GREATEST(COALESCE(w.citation_count,0),0)  AS citation_count, \
            COALESCE(w.reference_count,0)      AS reference_count, \
            GREATEST(COALESCE(w.download_count,0),0)  AS download_count, \
            COALESCE(py.min_year,0)            AS min_year, \
            COALESCE(py.max_year,0)            AS max_year, \
            UNIX_TIMESTAMP(w.created_at)       AS created_ts \
        FROM works w \
        LEFT JOIN ( \
            SELECT work_id, MIN(year) AS min_year, MAX(year) AS max_year \
            FROM publications \
            WHERE work_id BETWEEN $start AND $end \
            GROUP BY work_id \
        ) py ON py.work_id = w.id \
        WHERE w.id BETWEEN $start AND $end

    sql_attr_string  = work_type
    sql_attr_string  = language
    sql_attr_uint    = citation_count
    sql_attr_uint    = reference_count
    sql_attr_uint    = download_count
    sql_attr_uint    = min_year
    sql_attr_uint    = max_year
    sql_attr_timestamp = created_ts

    sql_attr_multi   = uint years from ranged-query; \
        SELECT work_id, year FROM publications WHERE year IS NOT NULL AND work_id BETWEEN $start AND $end; \
        SELECT MIN(id), MAX(id) FROM works
    sql_attr_multi   = uint oa_flags from ranged-query; \
        SELECT DISTINCT work_id, open_access FROM publications WHERE work_id BETWEEN $start AND $end; \
        SELECT MIN(id), MAX(id) FROM works
    sql_attr_multi   = uint pr_flags from ranged-query; \
        SELECT DISTINCT work_id, peer_reviewed FROM publications WHERE work_id BETWEEN $start AND $end; \
        SELECT MIN(id), MAX(id) FROM works

    sql_joined_field = authors from ranged-query; \
        SELECT a.work_id, p.preferred_name FROM authorships a JOIN persons p ON p.id = a.person_id \
        WHERE a.role = 'AUTHOR' AND a.work_id BETWEEN $start AND $end ORDER BY a.work_id ASC; \
        SELECT MIN(id), MAX(id) FROM works
    sql_joined_field = subjects from ranged-query; \
        SELECT ws.work_id, s.term FROM work_subjects ws JOIN subjects s ON s.id = ws.subject_id \
        WHERE ws.work_id BETWEEN $start AND $end ORDER BY ws.work_id ASC; \
        SELECT MIN(id), MAX(id) FROM works
    sql_joined_field = venue from ranged-query; \
        SELECT p.work_id, CONCAT_WS(' ', v.name, COALESCE(v.abbreviated_name,'')) FROM publications p JOIN venues v ON v.id = p.venue_id \
        WHERE p.work_id BETWEEN $start AND $end ORDER BY p.work_id ASC; \
        SELECT MIN(id), MAX(id) FROM works
}

# Delta: only works touched within the window. killlist removes the same ids
# from the main table so the distributed table never double-counts.
source works_delta : src_ethnos
{
    sql_query_range  = SELECT MIN(id), MAX(id) FROM works WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)
    sql_query        = \
        SELECT \
            w.id                               AS id, \
            w.title                            AS title, \
            COALESCE(w.subtitle,'')            AS subtitle, \
            COALESCE(w.abstract,'')            AS abstract, \
            w.work_type                        AS work_type, \
            COALESCE(w.language,'')            AS language, \
            GREATEST(COALESCE(w.citation_count,0),0)  AS citation_count, \
            COALESCE(w.reference_count,0)      AS reference_count, \
            GREATEST(COALESCE(w.download_count,0),0)  AS download_count, \
            COALESCE(py.min_year,0)            AS min_year, \
            COALESCE(py.max_year,0)            AS max_year, \
            UNIX_TIMESTAMP(w.created_at)       AS created_ts \
        FROM works w \
        LEFT JOIN ( \
            SELECT work_id, MIN(year) AS min_year, MAX(year) AS max_year \
            FROM publications \
            WHERE work_id BETWEEN $start AND $end \
            GROUP BY work_id \
        ) py ON py.work_id = w.id \
        WHERE w.id BETWEEN $start AND $end \
          AND w.updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)

    sql_attr_string  = work_type
    sql_attr_string  = language
    sql_attr_uint    = citation_count
    sql_attr_uint    = reference_count
    sql_attr_uint    = download_count
    sql_attr_uint    = min_year
    sql_attr_uint    = max_year
    sql_attr_timestamp = created_ts

    sql_attr_multi   = uint years from ranged-query; \
        SELECT work_id, year FROM publications WHERE year IS NOT NULL AND work_id BETWEEN $start AND $end; \
        SELECT MIN(id), MAX(id) FROM works WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)
    sql_attr_multi   = uint oa_flags from ranged-query; \
        SELECT DISTINCT work_id, open_access FROM publications WHERE work_id BETWEEN $start AND $end; \
        SELECT MIN(id), MAX(id) FROM works WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)
    sql_attr_multi   = uint pr_flags from ranged-query; \
        SELECT DISTINCT work_id, peer_reviewed FROM publications WHERE work_id BETWEEN $start AND $end; \
        SELECT MIN(id), MAX(id) FROM works WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)

    sql_joined_field = authors from ranged-query; \
        SELECT a.work_id, p.preferred_name FROM authorships a JOIN persons p ON p.id = a.person_id \
        WHERE a.role = 'AUTHOR' AND a.work_id BETWEEN $start AND $end ORDER BY a.work_id ASC; \
        SELECT MIN(id), MAX(id) FROM works WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)
    sql_joined_field = subjects from ranged-query; \
        SELECT ws.work_id, s.term FROM work_subjects ws JOIN subjects s ON s.id = ws.subject_id \
        WHERE ws.work_id BETWEEN $start AND $end ORDER BY ws.work_id ASC; \
        SELECT MIN(id), MAX(id) FROM works WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)
    sql_joined_field = venue from ranged-query; \
        SELECT p.work_id, CONCAT_WS(' ', v.name, COALESCE(v.abbreviated_name,'')) FROM publications p JOIN venues v ON v.id = p.venue_id \
        WHERE p.work_id BETWEEN $start AND $end ORDER BY p.work_id ASC; \
        SELECT MIN(id), MAX(id) FROM works WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)

    sql_query_killlist = SELECT id FROM works WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)
}

#############################################################################
# PERSONS — main + delta
# Full-text fields: preferred_name, given_names, family_name.
# Attributes: total_works, total_citations, h_index, is_verified, latest_publication_year.
#############################################################################

source persons_main : src_ethnos
{
    sql_query_range  = SELECT MIN(id), MAX(id) FROM persons
    sql_query        = \
        SELECT \
            p.id                                  AS id, \
            p.preferred_name                      AS preferred_name, \
            COALESCE(p.given_names,'')            AS given_names, \
            COALESCE(p.family_name,'')            AS family_name, \
            COALESCE(p.total_works,0)             AS total_works, \
            COALESCE(p.total_citations,0)         AS total_citations, \
            COALESCE(p.h_index,0)                 AS h_index, \
            COALESCE(p.is_verified,0)             AS is_verified, \
            COALESCE(p.latest_publication_year,0) AS latest_publication_year \
        FROM persons p \
        WHERE p.id BETWEEN $start AND $end

    sql_attr_uint    = total_works
    sql_attr_uint    = total_citations
    sql_attr_uint    = h_index
    sql_attr_uint    = is_verified
    sql_attr_uint    = latest_publication_year
}

source persons_delta : src_ethnos
{
    sql_query_range  = SELECT MIN(id), MAX(id) FROM persons WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)
    sql_query        = \
        SELECT \
            p.id                                  AS id, \
            p.preferred_name                      AS preferred_name, \
            COALESCE(p.given_names,'')            AS given_names, \
            COALESCE(p.family_name,'')            AS family_name, \
            COALESCE(p.total_works,0)             AS total_works, \
            COALESCE(p.total_citations,0)         AS total_citations, \
            COALESCE(p.h_index,0)                 AS h_index, \
            COALESCE(p.is_verified,0)             AS is_verified, \
            COALESCE(p.latest_publication_year,0) AS latest_publication_year \
        FROM persons p \
        WHERE p.id BETWEEN $start AND $end \
          AND p.updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)

    sql_attr_uint    = total_works
    sql_attr_uint    = total_citations
    sql_attr_uint    = h_index
    sql_attr_uint    = is_verified
    sql_attr_uint    = latest_publication_year

    sql_query_killlist = SELECT id FROM persons WHERE updated_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR)
}

#############################################################################
# Tables
#############################################################################

# morphology stems the content fields (title / subtitle / abstract / subjects) with the
# Portuguese then English Snowball stemmers so singular/plural and inflected variants
# collapse to a shared stem (movimento ~ movimentos, ethnography ~ ethnographic).
# morphology_skip_fields excludes authors and venue so proper names are never stemmed.
table works_main
{
    type                   = plain
    source                 = works_main
    path                   = /var/lib/manticore/ethnos/works_main
    min_word_len           = 2
    min_prefix_len         = 3
    dict                   = keywords
    html_strip             = 1
    charset_table          = non_cjk
    morphology             = libstemmer_pt, libstemmer_en
    morphology_skip_fields = authors, venue
}

table works_delta : works_main
{
    source          = works_delta
    path            = /var/lib/manticore/ethnos/works_delta
}

table works
{
    type            = distributed
    local           = works_main
    local           = works_delta
}

table persons_main
{
    type            = plain
    source          = persons_main
    path            = /var/lib/manticore/ethnos/persons_main
    min_word_len    = 2
    min_prefix_len  = 3
    dict            = keywords
    charset_table   = non_cjk
}

table persons_delta : persons_main
{
    source          = persons_delta
    path            = /var/lib/manticore/ethnos/persons_delta
}

table persons
{
    type            = distributed
    local           = persons_main
    local           = persons_delta
}

#############################################################################
# Engine
#############################################################################

indexer
{
    mem_limit       = 1024M
    write_buffer    = 8M
}

searchd
{
    listen          = 127.0.0.1:9312
    listen          = 127.0.0.1:9306:mysql
    listen          = 127.0.0.1:9308:http
    log             = /var/log/manticore/searchd.log
    query_log       = /var/log/manticore/query.log
    pid_file        = /run/manticore/searchd.pid
    binlog_path     =
    network_timeout = 5
    max_packet_size = 128M
}
