#############################################################################
# Nginx front door for Ethnos_API
#
# Every port a client reaches is owned by nginx. The Node process binds
# __UPSTREAM_HOST__:__UPSTREAM_PORT__ (loopback, not routable) and nginx is the
# only public listener, so the documented API port contract is unchanged for
# consumers while the application itself moved behind the proxy.
#
# One server block serves both listeners: `ssl` is a per-listen parameter, so
# the plain and the TLS port share a single proxy body. The TLS listen and the
# certificate directives are rendered empty when no certificate is configured.
#
# Deploy: scripts/nginx/render-config.sh fills these placeholders from
# /etc/node-backend.env and installs the result to
# /etc/nginx/conf.d/ethnos-api.conf. The repo copy keeps the placeholders.
#############################################################################

upstream ethnos_api {
    server __UPSTREAM_HOST__:__UPSTREAM_PORT__ max_fails=0;
    keepalive 32;
}

server {
__LISTEN_DIRECTIVES__
    server_name __SERVER_NAME__;
__SSL_DIRECTIVES__
    server_tokens off;
    client_max_body_size __CLIENT_MAX_BODY_SIZE__;

    access_log /var/log/nginx/ethnos-api.access.log;
    error_log /var/log/nginx/ethnos-api.error.log;

    # No add_header here: HSTS, CSP, nosniff, frameguard and referrer policy are
    # set by helmet in src/app.js, and a header added at this level would ship a
    # duplicate of each.

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/xml application/javascript
               text/plain text/css text/xml image/svg+xml;

    proxy_http_version 1.1;
    # Keepalive to the upstream requires the hop-by-hop Connection header cleared.
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    # src/app.js sets `trust proxy` to 1, so Express reads the right-most entry of
    # X-Forwarded-For — the address nginx itself saw. A client-supplied value is
    # kept ahead of it for logging but cannot forge req.ip, and its presence is
    # what stops isLocalRequest() from granting the loopback rate-limit exemption
    # to every proxied request.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 2s;
    # Above REQUEST_TIMEOUT_MS so the application's own timeout answers first with
    # the documented error envelope instead of nginx cutting the socket.
    proxy_read_timeout __PROXY_TIMEOUT__;
    proxy_send_timeout __PROXY_TIMEOUT__;

    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_next_upstream off;

    location = /health/liveness {
        access_log off;
        proxy_pass http://ethnos_api;
    }

    location / {
        proxy_pass http://ethnos_api;
    }
}
