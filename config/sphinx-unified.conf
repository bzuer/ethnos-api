source persons_src : db_defaults
{
    type = mysql
    sql_query_pre = SET NAMES 'utf8mb4'
    sql_query_pre = SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED
    sql_query_range = SELECT MIN(person_id), MAX(person_id) FROM summary_persons
    sql_range_step = 100000
    sql_query = \
        SELECT \
            person_id, \
            preferred_name_search, \
            name_variations_search, \
            affiliations_search, \
            COALESCE(orcid, '') AS orcid, \
            is_verified, \
            total_publications_count, \
            total_citations_count, \
            COALESCE(latest_publication_year, 0) AS latest_publication_year, \
            COALESCE(h_index, 0) AS h_index \
        FROM summary_persons \
        WHERE person_id >= $start AND person_id <= $end
    sql_field_string = preferred_name_search
    sql_field_string = name_variations_search
    sql_field_string = affiliations_search
    sql_field_string = orcid
    sql_attr_uint = is_verified
    sql_attr_uint = total_publications_count
    sql_attr_uint = total_citations_count
    sql_attr_uint = latest_publication_year
    sql_attr_uint = h_index
}

