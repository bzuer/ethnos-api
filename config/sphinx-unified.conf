source db_defaults
{
    type = mysql
    sql_host = __DB_HOST__
    sql_user = __DB_USER__
    sql_pass = __DB_PASSWORD__
    sql_db = __DB_NAME__
    sql_port = __DB_PORT__
}

source publications_src : db_defaults
{
    type = mysql
    sql_query_pre = SET NAMES 'utf8mb4'
    sql_query_pre = SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED
    sql_query_range = SELECT MIN(publication_id), MAX(publication_id) FROM summary_publications
    sql_range_step = 100000
    sql_query = \
        SELECT \
            publication_id, \
            work_id, \
            venue_id, \
            publisher_id, \
            title_search, \
            abstract_search, \
            authors_search, \
            venue_search, \
            subjects_search, \
            doi, \
            work_type, \
            language, \
            publication_year, \
            open_access, \
            peer_reviewed, \
            has_files, \
            work_citation_count, \
            work_reference_count, \
            publication_download_count \
        FROM summary_publications \
        WHERE publication_id >= $start AND publication_id <= $end
    sql_field_string = title_search
    sql_field_string = abstract_search
    sql_field_string = authors_search
    sql_field_string = venue_search
    sql_field_string = subjects_search
    sql_field_string = doi
    sql_attr_uint = work_id
    sql_attr_uint = venue_id
    sql_attr_uint = publisher_id
    sql_attr_uint = publication_year
    sql_attr_uint = open_access
    sql_attr_uint = peer_reviewed
    sql_attr_uint = has_files
    sql_attr_uint = work_citation_count
    sql_attr_uint = work_reference_count
    sql_attr_uint = publication_download_count
    sql_attr_string = work_type
    sql_attr_string = language
}

index publications_poc
{
    source = publications_src
    path = /var/lib/ethnos-api/sphinx/publications_poc
    morphology = stem_en
    charset_table = 0..9, A..Z->a..z, _, a..z, U+00C0..U+00D6->U+00E0..U+00F6, U+00D8..U+00DE->U+00F8..U+00FE, U+00DF, U+00E0..U+00F6, U+00F8..U+00FF, U+0100..U+017F, U+0180..U+024F, U+1E00..U+1EFF
    index_exact_words = 1
    min_prefix_len = 3
    expand_keywords = 1
    min_word_len = 2
    html_strip = 1
    html_remove_elements = style, script
    dict = keywords
}

