source db_defaults
{
    type = mysql
    sql_host = __DB_HOST__
    sql_user = __DB_USER__
    sql_pass = __DB_PASSWORD__
    sql_db = __DB_NAME__
    sql_port = __DB_PORT__
}

source works_src : db_defaults
{
    type = mysql
    sql_query_pre = SET NAMES 'utf8mb4'
    sql_query_pre = SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED
    sql_query_range = SELECT MIN(id), MAX(id) FROM sphinx_works_summary
    sql_range_step = 100000
    sql_query = \
        SELECT \
            id, \
            title, \
            subtitle, \
            abstract, \
            author_string, \
            venue_name, \
            venue_abbrev, \
            first_author_name, \
            publisher_name, \
            doi, \
            publication_id, \
            venue_id, \
            publisher_id, \
            first_author_id, \
            author_count, \
            institutions_count, \
            citation_count, \
            reference_count, \
            resolved_references_count, \
            pending_references_count, \
            cited_by_count, \
            has_pending_references, \
            has_files, \
            created_ts, \
            year, \
            work_type, \
            language, \
            open_access, \
            peer_reviewed, \
            subjects_string \
        FROM sphinx_works_summary \
        WHERE id >= $start AND id <= $end
    sql_field_string = title
    sql_field_string = subtitle
    sql_field_string = abstract
    sql_field_string = author_string
    sql_field_string = venue_name
    sql_field_string = venue_abbrev
    sql_field_string = first_author_name
    sql_field_string = publisher_name
    sql_field_string = doi
    sql_field_string = subjects_string
    sql_attr_uint = publication_id
    sql_attr_uint = venue_id
    sql_attr_uint = publisher_id
    sql_attr_uint = first_author_id
    sql_attr_uint = author_count
    sql_attr_uint = institutions_count
    sql_attr_uint = citation_count
    sql_attr_uint = reference_count
    sql_attr_uint = resolved_references_count
    sql_attr_uint = pending_references_count
    sql_attr_uint = cited_by_count
    sql_attr_uint = has_pending_references
    sql_attr_uint = has_files
    sql_attr_uint = year
    sql_attr_uint = created_ts
    sql_attr_uint = open_access
    sql_attr_uint = peer_reviewed
    sql_attr_string = work_type
    sql_attr_string = language
}

source persons_src : db_defaults
{
    type = mysql
    sql_query_pre = SET NAMES 'utf8mb4'
    sql_query_pre = SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED
    sql_query_range = SELECT MIN(id), MAX(id) FROM sphinx_persons_summary
    sql_range_step = 100000
    sql_query = \
        SELECT \
            id, \
            search_content, \
            preferred_name, \
            is_verified, \
            total_works, \
            latest_publication_year \
        FROM sphinx_persons_summary \
        WHERE id >= $start AND id <= $end
    sql_field_string = search_content
    sql_field_string = preferred_name
    sql_attr_uint = is_verified
    sql_attr_uint = total_works
    sql_attr_uint = latest_publication_year
}

index works_poc
{
    source = works_src
    path = /var/lib/ethnos-api/sphinx/works_poc
    morphology = stem_en
    charset_table = 0..9, A..Z->a..z, _, a..z, U+00C0..U+00D6->U+00E0..U+00F6, U+00D8..U+00DE->U+00F8..U+00FE, U+00DF, U+00E0..U+00F6, U+00F8..U+00FF, U+0100..U+017F, U+0180..U+024F, U+1E00..U+1EFF
    index_exact_words = 1
    min_prefix_len = 3
    expand_keywords = 1
    min_word_len = 2
    html_strip = 1
    html_remove_elements = style, script
    dict = keywords
}

index persons_poc
{
    source = persons_src
