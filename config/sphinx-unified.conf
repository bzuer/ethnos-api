source venues_src : db_defaults
{
    type = mysql
    sql_query_pre = SET NAMES 'utf8mb4'
    sql_query_pre = SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED
    sql_query_range = SELECT MIN(venue_id), MAX(venue_id) FROM summary_venues
    sql_range_step = 100000
    sql_query = \
        SELECT \
            venue_id, \
            name_search, \
            abbrev_search, \
            publisher_search, \
            venue_type, \
            country_code, \
            issn, \
            eissn, \
            total_publications_count, \
            total_cited_by_count, \
            COALESCE(CAST(impact_factor * 1000 AS UNSIGNED), 0) AS impact_factor_x1000, \
            COALESCE(h_index, 0) AS h_index, \
            COALESCE(CAST(open_access_percentage * 100 AS UNSIGNED), 0) AS open_access_pct_x100 \
        FROM summary_venues \
        WHERE venue_id >= $start AND venue_id <= $end
    sql_field_string = name_search
    sql_field_string = abbrev_search
    sql_field_string = publisher_search
    sql_field_string = issn
    sql_field_string = eissn
    sql_attr_string = venue_type
    sql_attr_string = country_code
    sql_attr_uint = total_publications_count
    sql_attr_uint = total_cited_by_count
    sql_attr_uint = impact_factor_x1000
    sql_attr_uint = h_index
    sql_attr_uint = open_access_pct_x100
}

